[workspace]
resolver = "3"
members = ["crates/vecski-core", "crates/vecski-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/looskis/vecski"
readme = "README.md"
keywords = ["embeddings", "vector-search", "procrustes", "rag", "api"]
categories = ["science", "web-programming::http-server"]

[workspace.dependencies]
vecski-core = { path = "crates/vecski-core" }
faer = "0.24"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
safetensors = "0.8"
rand = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart", "http2"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors", "compression-gzip", "decompression-gzip", "limit", "timeout", "set-header"] }
utoipa = { version = "6", features = ["axum_extras"] }
bytes = "1"
uuid = { version = "1", features = ["v7", "serde"] }
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true

[profile.bench]
inherits = "release"
debug = true
strip = false
